name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NAME: TinyGW
  VERSION: "15.2.0"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true

      - name: build
        shell: msys2 {0}
        run: ./build.sh

      - name: release
        shell: pwsh
        run: |
          & "C:\Program Files\7-Zip\7z.exe" a -mx=9 "${{ env.NAME }}-${{ env.VERSION }}-x86_64.7z" tinygw

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-x86_64
          path: ${{ env.NAME }}-*.7z

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          name: "download ${{ env.NAME }}"
          tag_name: ${{ env.VERSION }}
          body: |
            # version ${{ env.VERSION }}
            
            ### Includes:
            - GCC with full optimization support
            - GDB for debugging
            - MinGW
            
            ## [${{ env.NAME }} for Windows x86_64](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/${{ env.NAME }}-${{ env.VERSION }}-x86_64.7z)
